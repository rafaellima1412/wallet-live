<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@twind/cdn@1"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-100">
  <form method="POST" action="/login" class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm space-y-5">
    <h1 class="text-2xl font-semibold text-slate-800 text-center">Entrar</h1>

    <div class="space-y-1">
      <label for="username" class="block text-sm font-medium text-slate-600">Usuário</label>
      <input type="text" id="username" name="username" placeholder="Digite seu usuário"
        class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    </div>

    <div class="space-y-1">
      <label for="password" class="block text-sm font-medium text-slate-600">Senha</label>
      <input type="password" id="password" name="password" placeholder="Digite sua senha"
        class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    </div>

    <button type="submit"
      class="w-full bg-indigo-600 text-white font-medium py-2 rounded-md hover:bg-indigo-700 transition-colors">
      Entrar
    </button>
  </form>
</body>

</html>
