services:
  db:
    image: postgres:16-alpine
    container_name: wallet-live-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc123
      POSTGRES_DB: carteira
    ports:
      - "5433:5432"
    volumes:
      - wallet-live-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carteira"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wallet-live-db-data:
